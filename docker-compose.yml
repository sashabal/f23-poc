services:
  capcheck:
    image: alpine:3.20
    command: ["sh","-c","apk add --no-cache busybox-extras >/dev/null 2>&1; while true; do { printf "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nConnection: close\r\n\r\n"; echo "=== F23 TAG ==="; grep "^Cap" /proc/self/status; } | nc -lp 8080 -w 2; done; echo F23-CTRL"]
    ports:
      - "8080"